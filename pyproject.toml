[project]
name = "webhook-delivery-platform"
version = "0.1.0"
description = "Multi-tenant service that delivers webhooks reliably"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.15.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that need Docker and run against a real PostgreSQL",
]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E","F","I","B","UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]


